<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 448" width="616" height="448" fill="none"
     preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;">
  <style>
    line, rect, polygon, path, circle, ellipse { vector-effect: non-scaling-stroke; }
    .d-group-title-red     { font: 600 12px/1.2 'Inter', system-ui, -apple-system, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; fill: #EA4A35; }
    .d-group-title-neutral { font: 600 12px/1.2 'Inter', system-ui, -apple-system, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; fill: #525263; }
    .d-card-title          { font: 400 13px/1.2 'Inter', system-ui, -apple-system, sans-serif; fill: #353B50; }
    .d-card-sub            { font: 400 12px/1.4 'Inter', system-ui, -apple-system, sans-serif; fill: #525263; }
    .d-conn-label          { font: 400 12px/1.2 'Inter', system-ui, -apple-system, sans-serif; fill: #353B50; }
  </style>

  <!-- The rows are the three IGs, in the order they compose -->
  <text x="8" y="116" class="d-group-title-red">CRD</text>
  <text x="8" y="220" class="d-group-title-red">DTR</text>
  <text x="8" y="324" class="d-group-title-red">PAS</text>

  <!-- ── PROVIDER EHR (external) ─────────────────────────────────── -->
  <rect x="48" y="30" width="160" height="370" rx="14" fill="#FFFFFF" stroke="#D3DBE6" stroke-width="2"/>
  <text x="128" y="54" text-anchor="middle" class="d-group-title-neutral">Provider EHR</text>

  <rect x="60" y="70" width="136" height="76" rx="10" fill="#F6F7F8"/>
  <text x="128" y="97" text-anchor="middle" class="d-card-title">CDS Hooks client</text>
  <text x="128" y="125" text-anchor="middle" class="d-card-sub">all four CRD hooks</text>

  <rect x="60" y="174" width="136" height="76" rx="10" fill="#F6F7F8"/>
  <text x="128" y="201" text-anchor="middle" class="d-card-title">DTR launcher</text>
  <text x="128" y="222" text-anchor="middle" class="d-card-sub">opens the app via</text>
  <text x="128" y="236" text-anchor="middle" class="d-card-sub">SMART App Launch</text>

  <rect x="60" y="278" width="136" height="76" rx="10" fill="#F6F7F8"/>
  <text x="128" y="305" text-anchor="middle" class="d-card-title">PAS client</text>
  <text x="128" y="326" text-anchor="middle" class="d-card-sub">submits the</text>
  <text x="128" y="340" text-anchor="middle" class="d-card-sub">Claim Bundle</text>

  <!-- ── PAYERBOX ─────────────────────────────────────────────────── -->
  <rect x="248" y="30" width="160" height="370" rx="14" fill="#FFFFFF" stroke="#EA4A35" stroke-width="2"/>
  <text x="328" y="54" text-anchor="middle" class="d-group-title-red">Payerbox</text>

  <rect x="260" y="70" width="136" height="76" rx="10" fill="#FCEEEB"/>
  <text x="328" y="97" text-anchor="middle" class="d-card-title">CRD service</text>
  <text x="328" y="118" text-anchor="middle" class="d-card-sub">receives hooks,</text>
  <text x="328" y="132" text-anchor="middle" class="d-card-sub">forwards for rules</text>

  <rect x="260" y="174" width="136" height="76" rx="10" fill="#FCEEEB"/>
  <text x="328" y="201" text-anchor="middle" class="d-card-title">DTR</text>
  <text x="328" y="222" text-anchor="middle" class="d-card-sub">Questionnaire +</text>
  <text x="328" y="236" text-anchor="middle" class="d-card-sub">FHIRPath prefill</text>

  <rect x="260" y="278" width="136" height="76" rx="10" fill="#FCEEEB"/>
  <text x="328" y="305" text-anchor="middle" class="d-card-title">PAS endpoint</text>
  <text x="328" y="326" text-anchor="middle" class="d-card-sub">Claim/$submit</text>
  <text x="328" y="340" text-anchor="middle" class="d-card-sub">validate + forward</text>

  <!-- ── HEALTH PLAN (external) ───────────────────────────────────── -->
  <rect x="448" y="30" width="160" height="370" rx="14" fill="#FFFFFF" stroke="#D3DBE6" stroke-width="2"/>
  <text x="528" y="54" text-anchor="middle" class="d-group-title-neutral">Health Plan</text>

  <rect x="460" y="70" width="136" height="76" rx="10" fill="#F6F7F8"/>
  <text x="528" y="97" text-anchor="middle" class="d-card-title">Decision service</text>
  <text x="528" y="118" text-anchor="middle" class="d-card-sub">coverage rules</text>
  <text x="528" y="132" text-anchor="middle" class="d-card-sub">and policies</text>


  <rect x="460" y="278" width="136" height="76" rx="10" fill="#F6F7F8"/>
  <text x="528" y="305" text-anchor="middle" class="d-card-title">UM system</text>
  <text x="528" y="326" text-anchor="middle" class="d-card-sub">adjudication,</text>
  <text x="528" y="340" text-anchor="middle" class="d-card-sub">clinical reviewer</text>

  <!-- EHR → Payerbox, one per stage -->
  <line x1="210" y1="108" x2="244" y2="108" stroke="#353B50" stroke-width="1"/>
  <polygon points="248,108 240,104 240,112" fill="#353B50"/>
  <line x1="210" y1="212" x2="244" y2="212" stroke="#353B50" stroke-width="1"/>
  <polygon points="248,212 240,208 240,216" fill="#353B50"/>
  <line x1="210" y1="316" x2="244" y2="316" stroke="#353B50" stroke-width="1"/>
  <polygon points="248,316 240,312 240,320" fill="#353B50"/>

  <!-- Payerbox → Health Plan, only where the plan is involved -->
  <line x1="410" y1="108" x2="444" y2="108" stroke="#353B50" stroke-width="1"/>
  <polygon points="448,108 440,104 440,112" fill="#353B50"/>
  <line x1="410" y1="316" x2="444" y2="316" stroke="#353B50" stroke-width="1"/>
  <polygon points="448,316 440,312 440,320" fill="#353B50"/>

  <!-- async decision back to the EHR, routed clear of the columns -->
  <path d="M 328 402 L 328 424 L 132 424 L 132 406" stroke="#353B50" stroke-width="1" fill="none"/>
  <polygon points="132,400 128,408 136,408" fill="#353B50"/>
  <rect x="152" y="417" width="156" height="14" fill="#FFFFFF"/>
  <text x="230" y="428" text-anchor="middle" class="d-conn-label">$inquire or Subscription</text>
</svg>
