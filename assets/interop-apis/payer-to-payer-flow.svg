<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 306" width="616" height="306" fill="none"
     preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;">
  <style>
    line, rect, polygon, path, circle, ellipse { vector-effect: non-scaling-stroke; }
    .d-group-title-red     { font: 600 12px/1.2 'Inter', system-ui, -apple-system, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; fill: #EA4A35; }
    .d-group-title-neutral { font: 600 12px/1.2 'Inter', system-ui, -apple-system, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; fill: #525263; }
    .d-card-title          { font: 400 13px/1.2 'Inter', system-ui, -apple-system, sans-serif; fill: #353B50; }
    .d-card-sub            { font: 400 12px/1.4 'Inter', system-ui, -apple-system, sans-serif; fill: #525263; }
    .d-conn-label          { font: 400 12px/1.2 'Inter', system-ui, -apple-system, sans-serif; fill: #353B50; }
    .d-muted               { fill: #8A8F9A; }
    .d-state-ok            { font: 600 11px/1.2 'Inter', system-ui, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; fill: #2E7D5B; }
    .d-state-next          { font: 600 11px/1.2 'Inter', system-ui, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; fill: #525263; }
  </style>

  <!-- ── ROLE 1 · responding (available today) ────────────────────── -->
  <text x="8" y="14" class="d-group-title-neutral">1 · Payerbox as the responding plan</text>
  <text x="600" y="14" text-anchor="end" class="d-state-ok">available today</text>

  <rect x="8" y="30" width="160" height="84" fill="#F6F7F8" stroke="#D3DBE6" stroke-width="1" rx="10"/>
  <text x="88" y="54" text-anchor="middle" class="d-group-title-neutral">Other payer</text>
  <text x="88" y="74" text-anchor="middle" class="d-card-sub">receiving plan</text>
  <text x="88" y="91" text-anchor="middle" class="d-card-sub">captures opt-in</text>

  <rect x="340" y="26" width="260" height="92" fill="#FFFFFF" stroke="#EA4A35" stroke-width="2" rx="14"/>
  <text x="470" y="46" text-anchor="middle" class="d-group-title-red">Payerbox</text>
  <rect x="360" y="56" width="220" height="52" fill="#FCEEEB" rx="10"/>
  <text x="470" y="78" text-anchor="middle" class="d-card-title">FHIR platform</text>
  <text x="470" y="98" text-anchor="middle" class="d-card-sub">consent validated · 5-yr EOB floor</text>

  <line x1="170" y1="60" x2="336" y2="60" stroke="#353B50" stroke-width="1"/>
  <polygon points="340,60 332,56 332,64" fill="#353B50"/>
  <text x="253" y="52" text-anchor="middle" class="d-conn-label">$bulk-member-match</text>

  <line x1="336" y1="96" x2="174" y2="96" stroke="#353B50" stroke-width="1"/>
  <polygon points="170,96 178,92 178,100" fill="#353B50"/>
  <text x="253" y="88" text-anchor="middle" class="d-conn-label">$davinci-data-export</text>

  <!-- divider -->
  <line x1="8" y1="140" x2="600" y2="140" stroke="#D3DBE6" stroke-width="1"/>

  <!-- ── ROLE 2 · requesting (on the roadmap) ─────────────────────── -->
  <text x="8" y="166" class="d-group-title-neutral">2 · Payerbox as the requesting plan</text>
  <text x="600" y="166" text-anchor="end" class="d-state-next">on the roadmap</text>

  <rect x="8" y="182" width="160" height="84" fill="#F6F7F8" stroke="#D3DBE6" stroke-width="2"
        stroke-dasharray="5 4" rx="12"/>
  <text x="88" y="206" text-anchor="middle" class="d-group-title-neutral">Prior payer</text>
  <text x="88" y="226" text-anchor="middle" class="d-card-sub">previous plan</text>
  <text x="88" y="243" text-anchor="middle" class="d-card-sub">holds the history</text>

  <rect x="340" y="178" width="260" height="92" fill="#FFFFFF" stroke="#EA4A35" stroke-width="2"
        stroke-dasharray="5 4" rx="14"/>
  <text x="470" y="198" text-anchor="middle" class="d-group-title-red">Payerbox</text>
  <rect x="360" y="208" width="220" height="52" fill="#FCEEEB" rx="10"/>
  <text x="470" y="230" text-anchor="middle" class="d-card-title">Outbound client</text>
  <text x="470" y="250" text-anchor="middle" class="d-card-sub">planned</text>

  <line x1="336" y1="212" x2="174" y2="212" stroke="#A6ACB8" stroke-width="1" stroke-dasharray="5 4"/>
  <polygon points="170,212 178,208 178,216" fill="#A6ACB8"/>
  <text x="253" y="204" text-anchor="middle" class="d-conn-label">$bulk-member-match</text>

  <line x1="170" y1="248" x2="336" y2="248" stroke="#A6ACB8" stroke-width="1" stroke-dasharray="5 4"/>
  <polygon points="340,248 332,244 332,252" fill="#A6ACB8"/>
  <text x="253" y="240" text-anchor="middle" class="d-conn-label">member history</text>

  <text x="8" y="294" class="d-card-sub">CMS-0057-F requires both roles: request for arriving members, respond for departing ones.</text>
</svg>
